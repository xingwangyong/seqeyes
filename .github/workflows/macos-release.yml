name: Build & Release SeqEyes (macOS)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  version_guard:
    uses: ./.github/workflows/_release-version-guard.yml
    with:
      release_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  build_macos:
    needs: version_guard
    name: Build macOS app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            os: macos-15
            cmake_arch: arm64
            expected_arch: arm64
          - name: x86_64
            os: macos-15-intel
            cmake_arch: x86_64
            expected_arch: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt 6.9.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          cache: true

      - name: Clean build directories
        shell: bash
        run: rm -rf _cmake_build macos-stage

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B _cmake_build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}"
          -DSEQEYES_BUILD_TESTS=OFF
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/macos-stage"

      - name: Build
        run: cmake --build _cmake_build --config Release --verbose

      - name: Install app bundle
        run: cmake --install _cmake_build --config Release

      - name: Ad-hoc sign app bundle
        if: matrix.name == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          APP="macos-stage/seqeyes/bin/seqeyes.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify app bundle linkage
        shell: bash
        run: |
          set -euo pipefail
          APP="macos-stage/seqeyes/bin/seqeyes.app"
          EXE="$APP/Contents/MacOS/seqeyes"
          test -d "$APP"
          test -x "$EXE"
          test -d "$APP/Contents/Frameworks"
          echo "Runner machine: $(uname -m)"
          file "$EXE"
          lipo -archs "$EXE"
          if ! lipo -archs "$EXE" | tr ' ' '\n' | grep -qx "${{ matrix.expected_arch }}"; then
            echo "Expected ${{ matrix.expected_arch }} binary, got: $(lipo -archs "$EXE")"
            exit 1
          fi
          while IFS= read -r -d '' item; do
            if file "$item" | grep -q "Mach-O"; then
              archs="$(lipo -archs "$item" 2>/dev/null || true)"
              echo "$archs  $item"
              if ! printf "%s\n" "$archs" | tr ' ' '\n' | grep -qx "${{ matrix.expected_arch }}"; then
                echo "Expected ${{ matrix.expected_arch }} in $item, got: $archs"
                exit 1
              fi
            fi
          done < <(find "$APP" -type f -print0)
          otool -l "$EXE" | grep -A2 LC_RPATH
          otool -L "$EXE"

      - name: Create app zip
        id: app_zip
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            zip_name="seqeyes-${{ github.event.release.tag_name }}-macos-${{ matrix.name }}.zip"
          else
            zip_name="seqeyes-latest-macos-${{ matrix.name }}.zip"
          fi
          ditto -c -k --keepParent "macos-stage/seqeyes/bin/seqeyes.app" "$zip_name"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Smoke test arm64 app launch from zip
        if: matrix.name == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf smoke-test
          mkdir smoke-test
          ditto -x -k "${{ steps.app_zip.outputs.zip_name }}" smoke-test

          APP="smoke-test/seqeyes.app"
          EXE="$APP/Contents/MacOS/seqeyes"
          test -d "$APP"
          test -x "$EXE"

          echo "Checking executable architecture:"
          file "$EXE"
          archs="$(lipo -archs "$EXE")"
          echo "Architectures: $archs"
          if ! printf "%s\n" "$archs" | tr ' ' '\n' | grep -qx "arm64"; then
            echo "Expected arm64 executable, got: $archs"
            exit 1
          fi

          echo "Checking code signature:"
          codesign --verify --deep --strict --verbose=2 "$APP" || {
            echo "Code signature verification failed; applying ad-hoc signature."
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          }

          echo "Launching app binary for smoke test:"
          "$EXE" &
          APP_PID=$!
          sleep 5

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "App launched and stayed alive for 5 seconds."
            kill "$APP_PID"
            wait "$APP_PID" 2>/dev/null || true
          else
            echo "App failed to stay running during launch smoke test."
            exit 1
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: seqeyes-macos-${{ matrix.name }}
          path: ${{ steps.app_zip.outputs.zip_name }}

  upload_release:
    if: github.event_name == 'release'
    needs: build_macos
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download macOS app artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: seqeyes-macos-*
          path: dist/
          merge-multiple: true

      - name: Upload macOS apps to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
