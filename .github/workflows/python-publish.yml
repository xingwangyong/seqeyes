name: Python Publish

on:
  push:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Where to publish: pypi or testpypi"
        type: choice
        required: true
        default: "testpypi"
        options:
          - testpypi
          - pypi

jobs:
  version_guard:
    uses: ./.github/workflows/_release-version-guard.yml
    with:
      release_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  build-wheels:
    needs: version_guard
    name: Build wheel on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-2022
            qt_arch: win64_msvc2022_64
            plat_name: win_amd64
          - name: macos-arm64
            os: macos-latest
            plat_name: macosx_11_0_arm64
          - name: macos-x86_64
            os: macos-15-intel # github will deprecate this in Fall 2027, https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/
            plat_name: macosx_11_0_x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive TestPyPI version
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi')
        shell: bash
        run: |
          latest_tag="$(git describe --tags --abbrev=0 --match 'v*')"
          base_version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$base_version"
          next_patch=$((patch + 1))
          pretend_version="${major}.${minor}.${next_patch}.dev${GITHUB_RUN_NUMBER}"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${pretend_version}" >> "$GITHUB_ENV"
          echo "Using TestPyPI version: ${pretend_version}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- Qt ----
      - name: Install Qt 6.8 LTS (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Qt 6.9.2 (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          cache: true

      # ---- MSVC (Windows only) ----
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ---- Clean stale build artifacts (prevents moc version mismatch) ----
      - name: Clean build directories
        shell: bash
        run: rm -rf _cmake_build seqeyes_autogen

      # ---- Build & install the seqeyes C++ binary into python/seqeyes/bin/ ----
      - name: Configure (CMake)
        run: >
          cmake -S . -B _cmake_build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_VERBOSE_MAKEFILE=ON
          -DSEQEYES_BUILD_TESTS=OFF
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/python"

      - name: Build (CMake)
        run: cmake --build _cmake_build --config Release --verbose

      - name: Install binary into package tree
        run: cmake --install _cmake_build --config Release

      - name: Verify macOS app bundle linkage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="python/seqeyes/bin/seqeyes.app/Contents/MacOS/seqeyes"
          test -x "$APP"
          test -d "python/seqeyes/bin/seqeyes.app/Contents/Frameworks"
          otool -l "$APP" | grep -A2 LC_RPATH
          otool -L "$APP"

      # ---- Build Python wheel (pure setuptools, binary now present) ----
      - name: Build wheel
        shell: bash
        run: |
          pip install build
          if [ -n "${{ matrix.plat_name }}" ]; then
            python -m build --wheel --outdir wheelhouse --config-setting="--build-option=--plat-name=${{ matrix.plat_name }}"
          else
            python -m build --wheel --outdir wheelhouse
          fi

      # ---- Repair wheel: bundle Qt shared libraries ----
      - name: Copy wheel (macOS - skip delocate)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp wheelhouse/*.whl dist/

      - name: Copy wheel (Windows - windeployqt already ran via cmake install)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item wheelhouse\*.whl dist\

      # ---- Upload ----
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl

  build-linux-appimage:
    needs: version_guard
    uses: ./.github/workflows/_appimage-build.yml

  build-linux-wheel-from-appimage:
    name: Build Linux wheel (AppImage wrapper)
    needs: build-linux-appimage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: seqeyes-appimage
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Derive TestPyPI version
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi')
        shell: bash
        run: |
          latest_tag="$(git describe --tags --abbrev=0 --match 'v*')"
          base_version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$base_version"
          next_patch=$((patch + 1))
          pretend_version="${major}.${minor}.${next_patch}.dev${GITHUB_RUN_NUMBER}"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${pretend_version}" >> "$GITHUB_ENV"
          echo "Using TestPyPI version: ${pretend_version}"

      - name: Build Linux wheel (AppImage wrapper)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p python/seqeyes/bin
          cp seqeyes-x86_64.AppImage python/seqeyes/bin/seqeyes.AppImage
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel --outdir dist --config-setting="--build-option=--plat-name=manylinux_2_28_x86_64"

      - name: Upload Linux wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/*.whl

  publish:
    name: Publish wheels
    needs:
      - build-wheels
      - build-linux-wheel-from-appimage
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi')) && 'https://pypi.org/project/seqeyes/' || 'https://test.pypi.org/project/seqeyes/' }}
    permissions:
      id-token: write
    env:
      PUBLISH_TARGET: ${{ github.event_name == 'release' && 'pypi' || (github.event_name == 'workflow_dispatch' && inputs.publish_target || 'testpypi') }}

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ env.PUBLISH_TARGET == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # TODO: finalize by parent repo owner - configure PyPI trusted publisher
          # or set the PYPI_API_TOKEN secret in repo settings.
          # password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
