name: Build & Validate (Windows + Linux + macOS)

on:
  push:
    paths-ignore:
      - "**.md"
      - "doc/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "doc/**"
      - "LICENSE"
      - ".gitignore"

jobs:
  build_windows:
    uses: ./.github/workflows/_windows-build.yml

  build_linux:
    uses: ./.github/workflows/_appimage-build.yml

  build_macos:
    uses: ./.github/workflows/_macos-build.yml

  visual_regression:
    needs: build_windows
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Runtime Zip
        uses: actions/download-artifact@v4
        with:
          name: seqeyes-ci-runtime
          path: .

      - name: Extract Runtime
        shell: pwsh
        run: |
          Expand-Archive -Path seqeyes-ci-runtime.zip -DestinationPath runtime -Force

      - name: Setup Python Dependencies
        run: pip install Pillow gdown pyyaml

      - name: Download Baseline Folder from Google Drive
        env:
          GDRIVE_BASELINE_FOLDER_ID: "1Lhbd8zXQlI6z_o0f6HQPDb1umb_zLush"
        run: |
          mkdir test/baselines -ErrorAction SilentlyContinue
          mkdir test/baseline_downloads -ErrorAction SilentlyContinue
          gdown --folder "https://drive.google.com/drive/folders/$env:GDRIVE_BASELINE_FOLDER_ID" -O test/baseline_downloads/
          $visual = Get-ChildItem -Path test/baseline_downloads -Recurse -File | Where-Object { $_.Name -match '^traj-seq-pngs(\.zip)?$' -or $_.Name -match '^traj-seq-pngs.*\.zip$' } | Select-Object -First 1
          if (-not $visual) {
            Write-Error "Cannot find visual baseline zip named like 'traj-seq-pngs' in downloaded folder."
            exit 1
          }
          Copy-Item -Path $visual.FullName -Destination test/visual-baselines.zip -Force
          python -c "import zipfile; zipfile.ZipFile('test/visual-baselines.zip').extractall('test/baselines')"

      - name: Run Visual Regression Test
        run: |
          python test/test_visual_regression.py --bin-dir runtime/seqeyes --threshold 0.005 --changed-threshold 0.0001 --fail-on-missing-baseline

      - name: Upload Visual Diff Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            test/snapshots/*_baseline.png
            test/snapshots/*_current.png
            test/snapshots/*_diff.png

  trajectory_regression:
    needs: build_windows
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Runtime Zip
        uses: actions/download-artifact@v4
        with:
          name: seqeyes-ci-runtime
          path: .

      - name: Extract Runtime
        shell: pwsh
        run: |
          Expand-Archive -Path seqeyes-ci-runtime.zip -DestinationPath runtime -Force

      - name: Setup Python Dependencies
        run: pip install gdown pyyaml

      - name: Download Baseline Folder from Google Drive
        env:
          GDRIVE_BASELINE_FOLDER_ID: "1Lhbd8zXQlI6z_o0f6HQPDb1umb_zLush"
        run: |
          mkdir test/trajectory_baselines -ErrorAction SilentlyContinue
          mkdir test/baseline_downloads -ErrorAction SilentlyContinue
          gdown --folder "https://drive.google.com/drive/folders/$env:GDRIVE_BASELINE_FOLDER_ID" -O test/baseline_downloads/
          $traj = Get-ChildItem -Path test/baseline_downloads -Recurse -File | Where-Object { $_.Name -match '^traj-txt(\.zip)?$' -or $_.Name -match '^traj-txt.*\.zip$' } | Select-Object -First 1
          if (-not $traj) {
            Write-Error "Cannot find trajectory baseline zip named like 'traj-txt' in downloaded folder."
            exit 1
          }
          Copy-Item -Path $traj.FullName -Destination test/trajectory-baselines.zip -Force
          python -c "import zipfile; zipfile.ZipFile('test/trajectory-baselines.zip').extractall('test/trajectory_baselines')"

      - name: Run Trajectory Baseline Regression
        run: |
          python test/tools/check_trajectory_against_baseline.py --bin-dir runtime/seqeyes --cases test/trajectory_regression_cases.yaml --baseline-root test/trajectory_baselines --out-dir test/trajectory_regression_ci_out

  headless_load:
    needs: build_windows
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Runtime Zip
        uses: actions/download-artifact@v4
        with:
          name: seqeyes-ci-runtime
          path: .

      - name: Extract Runtime
        shell: pwsh
        run: |
          Expand-Archive -Path seqeyes-ci-runtime.zip -DestinationPath runtime -Force

      - name: Run Headless Load Test
        run: python test/test_load_all.py --bin-dir runtime/seqeyes

      - name: Upload Headless Markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-load-markers
          path: test/headless_markers
          if-no-files-found: warn

  qt_cpp_tests:
    needs: build_windows
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Runtime Zip
        uses: actions/download-artifact@v4
        with:
          name: seqeyes-ci-runtime
          path: .

      - name: Extract Runtime
        shell: pwsh
        run: |
          Expand-Archive -Path seqeyes-ci-runtime.zip -DestinationPath runtime -Force

      # TimeSliderSyncTest is intentionally left out of cloud CI. It has been
      # reliable as a local Qt interaction check, but too sensitive to hosted
      # Windows runner environment variance. Keep sequence-open coverage in
      # headless_load and run zoom/pan locally when working in that area.

      - name: Run ReopenEquivalenceTest
        run: python test/test_reopen.py --bin-dir runtime/seqeyes --qt-bin runtime/seqeyes

      - name: Run PulseqLoaderStateTest
        run: python test/test_loader_state.py --bin-dir runtime/seqeyes --qt-bin runtime/seqeyes

      - name: Run RfMultichannelDetectionTest
        shell: pwsh
        timeout-minutes: 5
        run: |
          $root = (Resolve-Path "runtime/seqeyes").Path
          $env:QT_QPA_PLATFORM = "offscreen"
          $platformDir = Join-Path $root "platforms"
          if (Test-Path $platformDir) {
            $env:QT_QPA_PLATFORM_PLUGIN_PATH = $platformDir
          }
          $candidates = @(
            (Join-Path $root "RfMultichannelDetectionTest.exe"),
            (Join-Path $root "test/RfMultichannelDetectionTest.exe"),
            (Join-Path $root "test/Release/RfMultichannelDetectionTest.exe")
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Write-Error "RfMultichannelDetectionTest.exe not found under $root"
            exit 1
          }
          $env:PATH = "$root;$env:PATH"
          & $exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  performance:
    needs: build_windows
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Runtime Zip
        uses: actions/download-artifact@v4
        with:
          name: seqeyes-ci-runtime
          path: .

      - name: Extract Runtime
        shell: pwsh
        run: |
          Expand-Archive -Path seqeyes-ci-runtime.zip -DestinationPath runtime -Force

      - name: Run Performance Test
        run: |
          python test/test_perf_zoom.py --bin-dir runtime/seqeyes --github-benchmark-out test/perf_bench.json --repeat 5 --warmup

  package_windows_artifact:
    needs: build_windows
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Download Runtime Zip
        uses: actions/download-artifact@v4
        with:
          name: seqeyes-ci-runtime
          path: .

      - name: Create CI Windows Package
        shell: pwsh
        run: |
          Expand-Archive -Path seqeyes-ci-runtime.zip -DestinationPath package-runtime -Force
          Remove-Item -Path package-runtime\seqeyes\test -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path package-runtime\seqeyes\Qt6Test.dll -Force -ErrorAction SilentlyContinue
          Remove-Item -Path package-runtime\seqeyes\platforms\qminimal.dll -Force -ErrorAction SilentlyContinue
          Remove-Item -Path package-runtime\seqeyes\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path package-runtime\seqeyes -DestinationPath seqeyes-latest-win64.zip -Force

      - name: Upload Windows CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seqeyes-latest-win64
          path: seqeyes-latest-win64.zip

  cleanup_internal_artifacts:
    if: ${{ always() }}
    needs: [build_windows, build_linux, build_macos, visual_regression, trajectory_regression, headless_load, qt_cpp_tests, performance, package_windows_artifact]
    runs-on: windows-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete Internal Runtime Artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $runId = "${{ github.run_id }}"
          $ids = gh api "repos/$repo/actions/runs/$runId/artifacts" --paginate --jq '.artifacts[] | select(.name=="seqeyes-ci-runtime") | .id'
          if (-not $ids) {
            Write-Host "No internal runtime artifact found to delete."
            exit 0
          }
          foreach ($id in $ids) {
            gh api -X DELETE "repos/$repo/actions/artifacts/$id"
            Write-Host "Deleted internal artifact id=$id"
          }
