name: Build & Release SeqEyes (Windows)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  version_guard:
    uses: ./.github/workflows/_release-version-guard.yml
    with:
      release_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  build_windows:
    needs: version_guard
    uses: ./.github/workflows/_windows-build.yml

  visual_regression:
    needs: build_windows
    uses: ./.github/workflows/_visual-regression.yml

  headless_load:
    needs: build_windows
    uses: ./.github/workflows/_headless-load.yml

  qt_cpp_tests:
    needs: build_windows
    uses: ./.github/workflows/_qt-cpp-tests.yml

  performance:
    needs: build_windows
    permissions:
      contents: write
    uses: ./.github/workflows/_performance.yml
    with:
      store_benchmark: true

  package_release:
    needs: [visual_regression, headless_load, qt_cpp_tests, performance]
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download Runtime Zip
        uses: actions/download-artifact@v4
        with:
          name: seqeyes-ci-runtime
          path: .

      - name: Create Final ZIP Name
        id: final_zip
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $zipName = "seqeyes-${{ github.event.release.tag_name }}-win64.zip"
          } else {
            $zipName = "seqeyes-latest-win64.zip"
          }
          Expand-Archive -Path seqeyes-ci-runtime.zip -DestinationPath release-runtime -Force
          Remove-Item -Path release-runtime\seqeyes\test -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path release-runtime\seqeyes\Qt6Test.dll -Force -ErrorAction SilentlyContinue
          Remove-Item -Path release-runtime\seqeyes\platforms\qminimal.dll -Force -ErrorAction SilentlyContinue
          Remove-Item -Path release-runtime\seqeyes\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path release-runtime\seqeyes -DestinationPath $zipName -Force
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.final_zip.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: seqeyes-latest-win64
          path: seqeyes-latest-win64.zip

  cleanup_internal_artifacts:
    if: ${{ always() }}
    needs: [build_windows, visual_regression, headless_load, qt_cpp_tests, performance, package_release]
    runs-on: windows-2022
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete Internal Runtime Artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $runId = "${{ github.run_id }}"
          $ids = gh api "repos/$repo/actions/runs/$runId/artifacts" --paginate --jq '.artifacts[] | select(.name=="seqeyes-ci-runtime") | .id'
          if (-not $ids) {
            Write-Host "No internal runtime artifact found to delete."
            exit 0
          }
          foreach ($id in $ids) {
            gh api -X DELETE "repos/$repo/actions/artifacts/$id"
            Write-Host "Deleted internal artifact id=$id"
          }
