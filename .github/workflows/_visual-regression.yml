name: Visual Regression (Reusable)

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Name of the Windows runtime artifact"
        required: false
        type: string
        default: seqeyes-ci-runtime
      bin_dir:
        description: "Path to the extracted SeqEyes runtime"
        required: false
        type: string
        default: runtime/seqeyes
      threshold:
        description: "Allowed visual difference threshold"
        required: false
        type: string
        default: "0.005"
      changed_threshold:
        description: "Allowed changed-pixel ratio threshold"
        required: false
        type: string
        default: "0.0001"
      max_failed_checks:
        description: "Maximum failed visual checks to report before stopping"
        required: false
        type: string
        default: "5"
      baseline_folder_id:
        description: "Public Google Drive folder containing visual baselines"
        required: false
        type: string
        default: 1Lhbd8zXQlI6z_o0f6HQPDb1umb_zLush

jobs:
  visual_regression:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Windows Runtime
        uses: ./.github/actions/prepare-windows-runtime
        with:
          artifact_name: ${{ inputs.artifact_name }}

      - name: Setup Python Dependencies
        run: pip install Pillow gdown pyyaml

      - name: Download Visual Baselines from Google Drive
        env:
          # Baselines in this folder are expected to be generated by
          # .github/workflows/visual-baseline-capture.yml on windows-2022.
          # Hardcoded public folder ID to ensure it works automatically in forks.
          GDRIVE_BASELINE_FOLDER_ID: ${{ inputs.baseline_folder_id }}
        run: |
          mkdir test/baselines -ErrorAction SilentlyContinue
          mkdir test/baseline_downloads -ErrorAction SilentlyContinue
          gdown --folder "https://drive.google.com/drive/folders/$env:GDRIVE_BASELINE_FOLDER_ID" -O test/baseline_downloads/
          $visual = Get-ChildItem -Path test/baseline_downloads -Recurse -File | Where-Object { $_.Name -match '^traj-seq-pngs(\.zip)?$' -or $_.Name -match '^traj-seq-pngs.*\.zip$' } | Select-Object -First 1
          if (-not $visual) {
            Write-Error "Cannot find visual baseline zip named like 'traj-seq-pngs' in downloaded folder."
            exit 1
          }
          Copy-Item -Path $visual.FullName -Destination test/visual-baselines.zip -Force
          python -c "import zipfile; zipfile.ZipFile('test/visual-baselines.zip').extractall('test/baselines')"
          $pngCount = (Get-ChildItem -Path test/baselines -Recurse -File -Filter *.png).Count
          Write-Host "Extracted visual baseline PNG count: $pngCount"
          if ($pngCount -eq 0) {
            Write-Error "Visual baseline zip extracted no PNG files."
            exit 1
          }

      - name: Run Visual Regression Test
        id: visual_test
        run: |
          python test/test_visual_regression.py --bin-dir "${{ inputs.bin_dir }}" --threshold ${{ inputs.threshold }} --changed-threshold ${{ inputs.changed_threshold }} --fail-on-missing-baseline --max-failed-checks ${{ inputs.max_failed_checks }}

      - name: Upload Visual Diff Artifacts on Failure
        if: failure() && steps.visual_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            test/snapshots/*_baseline.png
            test/snapshots/*_current.png
            test/snapshots/*_diff.png
            test/snapshots/*.png
            test/baselines/*.png
