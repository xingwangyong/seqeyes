name: Build Windows Runtime (Reusable)

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "Name of the Windows runtime artifact"
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.set-artifact.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.5.3 (MSVC 2019)
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.5.3"
          arch: "win64_msvc2019_64"
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Configure (CMake)
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake --build build --config Release

      - name: Print sccache stats
        run: sccache --show-stats

      - name: Pack Runtime Zip
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix install-stage

          $runtimeRoot = "runtime\seqeyes"
          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
          Copy-Item -Path "install-stage\seqeyes\bin\*" -Destination $runtimeRoot -Recurse -Force

          $qtBin = Split-Path ((Get-Command windeployqt).Source)
          $qtTestDll = Join-Path $qtBin "Qt6Test.dll"
          if (-not (Test-Path $qtTestDll)) {
            Write-Error "Qt6Test.dll not found under $qtBin"
            exit 1
          }
          Copy-Item -Path $qtTestDll -Destination $runtimeRoot -Force
          $qtPlugins = Join-Path (Split-Path $qtBin) "plugins"
          New-Item -ItemType Directory -Path "$runtimeRoot\platforms" -Force | Out-Null
          foreach ($platformPlugin in @("qminimal.dll", "qoffscreen.dll")) {
            $pluginPath = Join-Path $qtPlugins "platforms/$platformPlugin"
            if (-not (Test-Path $pluginPath)) {
              Write-Error "$platformPlugin not found under $qtPlugins"
              exit 1
            }
            Copy-Item -Path $pluginPath -Destination "$runtimeRoot\platforms" -Force
          }

          $testRoot = "$runtimeRoot\test"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $testExecutables = @(
            "ReopenEquivalenceTest.exe",
            "PulseqLoaderStateTest.exe",
            "RfMultichannelDetectionTest.exe",
            "PerfZoomTest.exe"
          )
          foreach ($testExe in $testExecutables) {
            $match = Get-ChildItem -Path build -Recurse -Filter $testExe -File | Select-Object -First 1
            if ($match) {
              Copy-Item -Path $match.FullName -Destination $testRoot -Force
            } else {
              Write-Warning "$testExe was not found under build."
            }
          }

          if (-not (Test-Path "$runtimeRoot\seqeyes.exe")) {
            Write-Error "Packaged runtime is missing seqeyes.exe"
            exit 1
          }
          Compress-Archive -Path runtime\seqeyes -DestinationPath seqeyes-ci-runtime.zip -Force

      - name: Set artifact name
        id: set-artifact
        shell: pwsh
        run: |
          "name=seqeyes-ci-runtime" >> $env:GITHUB_OUTPUT

      - name: Upload Runtime Zip
        uses: actions/upload-artifact@v4
        with:
          name: seqeyes-ci-runtime
          path: seqeyes-ci-runtime.zip
